
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#ea580c">
<title>나의 가계부</title>
<style>
:root{
  --accent:#ea580c;
  --accent-soft:#fff0e6;
  --bg:#f3f1f8;
  --card:#ffffff;
  --text:#252331;
  --muted:#777487;
  --border:#e9e6ef;
  --danger:#dc2626;
  --green:#15803d;
  --shadow:0 6px 24px rgba(35,30,60,.055);
}
*{box-sizing:border-box}
html{font-size:16px}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.5;
}
body.dark{
  --bg:#181720;
  --card:#262430;
  --text:#f5f3fa;
  --muted:#aaa5b8;
  --border:#403b4c;
  --accent-soft:#493025;
  --shadow:0 6px 24px rgba(0,0,0,.18);
  color-scheme:dark;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible{
  outline:3px solid #fb923c;
  outline-offset:2px;
}
#app{
  max-width:560px;
  min-height:100dvh;
  margin:auto;
  padding:0 16px calc(110px + env(safe-area-inset-bottom));
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:24px 4px 14px;
}
h1{font-size:24px;margin:0;letter-spacing:-.7px}
h2{font-size:19px;margin:0 0 14px}
h3{font-size:16px;margin:0 0 10px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.center{text-align:center}
.right{text-align:right}
.bold{font-weight:750}
.card{
  background:var(--card);
  border-radius:20px;
  padding:19px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
  min-width:0;
}
.hero{
  background:linear-gradient(140deg,#ea580c,#f97316);
  color:white;
}
.hero .muted{color:#ffeadc}
.hero h2{font-size:34px;margin:8px 0}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.row.wrap{flex-wrap:wrap}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.stat{
  border-radius:15px;
  padding:13px;
  background:var(--bg);
}
.stat strong{display:block;font-size:18px;word-break:break-word}
.month-nav{display:flex;align-items:center;gap:13px}
.iconbtn{
  width:44px;height:44px;border-radius:14px;
  border:0;background:var(--card);color:var(--text);
  font-size:24px;
}
.btn{
  min-height:46px;
  padding:10px 16px;
  border:0;border-radius:13px;
  font-weight:700;
  background:var(--accent);
  color:white;
}
.btn.secondary{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:var(--bg);color:var(--text)}
.btn.danger{background:var(--danger)}
.btn.outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.full{width:100%}
.btn.smallbtn{min-height:40px;font-size:13px;padding:8px 12px}
.field{margin:13px 0}
.field label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  font-weight:700;
}
input,select,textarea{
  width:100%;
  min-height:46px;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  outline:none;
}
textarea{resize:vertical;min-height:120px}
input[type="radio"],input[type="checkbox"]{
  width:auto;min-height:0;accent-color:var(--accent)
}
.chips{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:4px 0 9px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  min-height:39px;
  border-radius:30px;
  padding:8px 13px;
  white-space:nowrap;
  font-size:13px;
  flex-shrink:0;
}
.chip.active{
  background:var(--accent);
  color:white;border-color:var(--accent);
}
.transaction{
  display:flex;
  gap:10px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.transaction:last-child{border-bottom:0}
.tx-icon{
  width:44px;height:44px;
  border-radius:14px;
  background:var(--bg);
  display:grid;place-items:center;
  font-size:23px;flex-shrink:0;
}
.tx-main{flex:1;min-width:0}
.tx-main strong,.tx-main small{
  display:block;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;
}
.tx-main small{font-size:12px;color:var(--muted)}
.tx-amount{font-weight:750;white-space:nowrap}
.expense{color:var(--text)}
.income{color:var(--green)}
.progress{
  height:11px;border-radius:20px;
  background:var(--border);overflow:hidden;
  margin:9px 0;
}
.fill{
  height:100%;border-radius:20px;
  background:var(--green);
  transition:width .2s;
}
.fill.warn{background:var(--accent)}
.fill.over{background:var(--danger)}
.nav{
  position:fixed;
  bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:560px;
  display:grid;grid-template-columns:repeat(5,1fr);
  align-items:end;
  background:var(--card);
  border-top:1px solid var(--border);
  padding:9px 5px calc(9px + env(safe-area-inset-bottom));
  z-index:20;
  box-shadow:0 -5px 24px rgba(0,0,0,.04);
}
.nav button{
  background:none;border:0;color:var(--muted);
  min-height:52px;font-size:12px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
}
.nav button span{font-size:23px}
.nav button.active{color:var(--accent);font-weight:800}
.nav .plus{
  background:var(--accent);color:white;
  border-radius:50%;width:60px;height:60px;
  min-height:60px;margin:-22px auto 0;
  font-size:36px;box-shadow:0 6px 16px #ea580c55;
}
.overlay{
  position:fixed;inset:0;
  background:rgba(13,12,22,.55);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:50;
}
.modal{
  background:var(--card);
  border-radius:24px 24px 0 0;
  padding:22px 18px calc(28px + env(safe-area-inset-bottom));
  width:100%;max-width:560px;
  max-height:93dvh;overflow-y:auto;
}
.modal-head{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:14px;
}
.modal-head h2{margin:0}
.close{
  background:var(--bg);
  border:0;color:var(--text);
  border-radius:50%;width:40px;height:40px;font-size:23px;
}
.option{
  width:100%;min-height:58px;
  text-align:left;
  margin:5px 0;
  border:1px solid var(--border);
  background:var(--card);color:var(--text);
  border-radius:14px;padding:13px;
  font-weight:700;
}
.segment{
  display:flex;background:var(--bg);
  padding:4px;border-radius:13px;gap:4px;
}
.segment button{
  flex:1;border:0;border-radius:10px;
  min-height:43px;background:transparent;color:var(--muted);
}
.segment button.active{background:var(--accent);color:white}
.calendar{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px;
}
.day{
  min-height:68px;
  padding:5px 2px;
  border:1px solid var(--border);
  background:var(--card);color:var(--text);
  border-radius:9px;font-size:13px;
  text-align:center;
}
.day small{display:block;font-size:10px;margin-top:5px}
.day.selected{outline:2px solid var(--accent)}
.day.blank{background:transparent;border:0}
.weekday{text-align:center;font-size:12px;color:var(--muted);padding:8px 0}
.legend{
  display:flex;flex-wrap:wrap;gap:7px;
  justify-content:center;margin:12px 0;
}
.legend button{
  border:1px solid var(--border);
  background:var(--card);color:var(--text);
  border-radius:20px;padding:7px 10px;
  font-size:12px;
}
.legend button.active{border-color:var(--accent);color:var(--accent)}
.chartbox{display:flex;justify-content:center;margin:5px auto}
.chartbox svg{max-width:100%;height:auto}
.bar-chart{width:100%;height:205px}
.rank{
  padding:9px 0;border-bottom:1px solid var(--border);
}
.rank:last-child{border:0}
.toast{
  position:fixed;bottom:calc(95px + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);
  background:#292331;color:white;
  padding:13px 19px;border-radius:14px;
  z-index:100;max-width:90%;width:max-content;
  box-shadow:0 6px 20px #0003;font-size:14px;
}
.hidden{display:none!important}
.note{
  padding:12px;border-radius:12px;
  background:var(--bg);font-size:13px;
}
.preview{
  max-width:100%;max-height:260px;
  border-radius:12px;object-fit:contain;
}
.lock{
  position:fixed;inset:0;z-index:200;
  background:var(--bg);
  display:grid;place-items:center;padding:20px;
}
.lock .card{width:100%;max-width:340px}
code{overflow-wrap:anywhere}
@media(max-width:360px){
  .card{padding:14px}
  .hero h2{font-size:29px}
  .stat strong{font-size:15px}
  .day{min-height:58px}
  .day small{font-size:9px}
}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" class="nav"></nav>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="lockRoot"></div>

<input id="cameraInput" class="hidden" type="file"
 accept="image/*" capture="environment">
<input id="photoInput" class="hidden" type="file"
 accept="image/*" multiple>
<input id="csvInput" class="hidden" type="file" accept=".csv,text/csv">
<input id="jsonInput" class="hidden" type="file" accept=".json,application/json">

<script>
"use strict";

/* ---------- 기본 데이터 ---------- */
const KEY="soft_household_book_v1";
const APIKEY="soft_household_book_api_v1";
const VERSION=1;

const DEFAULT_EXP=[
["식비","🍚"],["카페·간식","☕"],["교통","🚌"],
["쇼핑","🛍️"],["패션·미용","💄"],["생활·마트","🛒"],
["주거·통신","🏠"],["의료·건강","💊"],
["문화·여가","🎬"],["교육·도서","📚"],
["경조사·선물","🎁"],["기타","📦"]
];
const DEFAULT_INC=[
["급여","💰"],["용돈","🧧"],["기타수입","💵"]
];
const PAYMENTS=["카드","현금","계좌이체","간편결제"];
const COLORS=[
"#ea580c","#f59e0b","#8b5cf6","#06b6d4",
"#10b981","#f43f5e","#6366f1","#84cc16",
"#e879f9","#14b8a6","#fb7185","#64748b",
"#a855f7","#0ea5e9","#d97706"
];

function initialDB(){
 return {
  version:VERSION,
  tx:[],
  cats:{
   expense:DEFAULT_EXP.map(x=>({name:x[0],emoji:x[1]})),
   income:DEFAULT_INC.map(x=>({name:x[0],emoji:x[1]}))
  },
  budgets:{total:0,categories:{}},
  recurring:[],
  ignored:[],
  learn:{},
  sampleIds:[],
  settings:{theme:"auto",ocr:"none"},
  pinHash:"",
  pinSalt:""
 };
}
function safeJSON(str,backup){
 try{return JSON.parse(str)||backup}catch{return backup}
}
function loadDB(){
 const raw=safeJSON(localStorage.getItem(KEY),{});
 const base=initialDB();
 return {
  ...base,...raw,
  cats:{...base.cats,...raw.cats},
  budgets:{...base.budgets,...raw.budgets,
   categories:{...(raw.budgets?.categories||{})}},
  settings:{...base.settings,...raw.settings},
  tx:Array.isArray(raw.tx)?raw.tx:[],
  recurring:Array.isArray(raw.recurring)?raw.recurring:[],
  ignored:Array.isArray(raw.ignored)?raw.ignored:[],
  sampleIds:Array.isArray(raw.sampleIds)?raw.sampleIds:[],
  learn:raw.learn&&typeof raw.learn==="object"?raw.learn:{}
 };
}
let db=loadDB();
let api=safeJSON(localStorage.getItem(APIKEY),{
 geminiKey:"",geminiModel:"gemini-3.5-flash",
 claudeKey:"",claudeModel:"claude-haiku-5-5"
});
let tab="home";
let month=new Date();
month.setDate(1);
let filter={
 q:"",cat:"전체",payment:"전체",view:"list",day:""
};
let selectedCat="";
let pending=[];
let pendingIndex=0;
let modalKind="";
let editingId=null;
let pendingImage=null;
let awayAt=0;
let locked=!!db.pinHash;
let toastTimer=null;

/* ---------- 공통 유틸리티 ---------- */
function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}
function uid(){
 return crypto.randomUUID?.()||
  (Date.now()+"-"+Math.random().toString(36).slice(2));
}
function num(v){
 return Math.max(0,Math.round(Number(
  String(v??"").replace(/[,원\s]/g,"")
 )||0));
}
function money(v){return Number(v||0).toLocaleString("ko-KR")+"원"}
function compact(v){
 v=Number(v)||0;
 if(v>=10000)return (Math.round(v/1000)/10).toString()+"만";
 if(v>=1000)return (Math.round(v/100)/10).toString()+"천";
 return String(v);
}
function localISO(d=new Date()){
 const y=d.getFullYear();
 return `${y}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function parseDate(s){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s)))return null;
 const [y,m,d]=s.split("-").map(Number);
 const x=new Date(y,m-1,d);
 return x.getFullYear()===y&&x.getMonth()===m-1&&
 x.getDate()===d?x:null;
}
function validDate(s){return !!parseDate(s)}
function addDays(d,n){
 const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
 return x;
}
function dateLabel(s){
 const d=parseDate(s);
 if(!d)return esc(s);
 return `${d.getMonth()+1}월 ${d.getDate()}일 (${["일","월","화","수","목","금","토"][d.getDay()]})`;
}
function ym(d){return localISO(d).slice(0,7)}
function currentYM(){return ym(month)}
function changeMonth(n){
 month=new Date(month.getFullYear(),month.getMonth()+n,1);
 filter.day="";selectedCat="";
 render();
}
function monthDate(s){
 const [y,m]=s.split("-").map(Number);
 return new Date(y,m-1,1);
}
function sum(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}
function transactions(m=currentYM(),type=null){
 return db.tx.filter(t=>(!m||t.date.startsWith(m))&&
 (!type||t.type===type));
}
function catList(type){return db.cats[type]||[]}
function emoji(cat,type="expense"){
 return catList(type).find(x=>x.name===cat)?.emoji||"📌";
}
function catOptions(type,selected){
 return catList(type).map(c=>
  `<option value="${esc(c.name)}" ${selected===c.name?"selected":""}>${esc(c.emoji+" "+c.name)}</option>`
 ).join("");
}
function toast(msg){
 const root=document.getElementById("toastRoot");
 root.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>root.innerHTML="",3400);
}
function persist(){
 try{
  localStorage.setItem(KEY,JSON.stringify(db));
  return true;
 }catch(e){
  const photos=db.tx.filter(t=>t.thumb)
   .sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  for(const t of photos){
   delete t.thumb;
   try{
    localStorage.setItem(KEY,JSON.stringify(db));
    toast("저장 공간이 부족해 오래된 사진을 정리했습니다.");
    return true;
   }catch{}
  }
  toast("저장 공간이 부족합니다. JSON 백업 후 자료를 정리해 주세요.");
  return false;
 }
}
function persistAPI(){
 try{localStorage.setItem(APIKEY,JSON.stringify(api));return true}
 catch{toast("API 설정을 저장하지 못했습니다.");return false}
}
function safeThumb(v){
 return typeof v==="string"&&
 /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(v)&&
 v.length<150000?v:undefined;
}
function normalizeTx(t){
 const type=t.type==="income"?"income":"expense";
 const cat=catList(type).some(c=>c.name===t.cat)?
 t.cat:(type==="income"?"기타수입":"기타");
 return {
  id:String(t.id||uid()),
  type,
  date:validDate(t.date)?t.date:localISO(),
  merchant:String(t.merchant||"미지정").slice(0,120),
  amount:num(t.amount),
  cat,
  payment:PAYMENTS.includes(t.payment)?t.payment:"카드",
  memo:String(t.memo||"").slice(0,1000),
  source:["manual","receipt","sms","quick","recurring","import"]
   .includes(t.source)?t.source:"manual",
  ...(safeThumb(t.thumb)?{thumb:safeThumb(t.thumb)}:{}),
  createdAt:String(t.createdAt||new Date().toISOString())
 };
}
function sorted(arr){
 return [...arr].sort((a,b)=>
  b.date.localeCompare(a.date)||
  String(b.createdAt).localeCompare(String(a.createdAt)));
}
function progress(p){
 const cl=p>=100?"over":p>=80?"warn":"";
 return `<div class="progress"><div class="fill ${cl}"
 style="width:${Math.min(100,Math.max(0,p))}%"></div></div>`;
}
function normMerchant(s){
 return String(s||"").toLowerCase()
 .replace(/\([^)]*\)/g,"")
 .replace(/\s+/g,"")
 .replace(/(?:[가-힣a-z0-9]+점|지점|본점)$/,"")
 .replace(/[^가-힣a-z0-9]/g,"");
}
function similar(a,b){
 const x=normMerchant(a),y=normMerchant(b);
 if(!x||!y)return false;
 return x===y||(Math.min(x.length,y.length)>=3&&
 (x.includes(y)||y.includes(x)));
}
function learnedCategory(merchant,type){
 if(type!=="expense")return null;
 const key=normMerchant(merchant);
 return catList("expense").some(c=>c.name===db.learn[key])?
 db.learn[key]:null;
}
function guessCat(merchant,type,memo=""){
 if(type==="income"){
  return /급여|월급|salary/i.test(merchant+" "+memo)?"급여":
   /용돈/.test(merchant+" "+memo)?"용돈":"기타수입";
 }
 const learned=learnedCategory(merchant,type);
 if(learned)return learned;
 const s=(merchant+" "+memo).toLowerCase();
 const patterns=[
 [/스타벅스|커피|카페|투썸|메가커피|빽다방|디저트|베이커리/,"카페·간식"],
 [/gs25|cu|세븐일레븐|이마트|홈플러스|마트|편의점|다이소|코스트코/,"생활·마트"],
 [/택시|버스|지하철|교통|주유|주차|기차|ktx/,"교통"],
 [/병원|의원|약국|치과|진료/,"의료·건강"],
 [/학원|학교|서점|교재|책|교육/,"교육·도서"],
 [/넷플릭스|영화|극장|공연|여행|숙박/,"문화·여가"],
 [/쿠팡|네이버쇼핑|쇼핑|아마존/,"쇼핑"],
 [/미용실|화장품|의류|패션|헤어/,"패션·미용"],
 [/월세|관리비|통신|전기|가스|인터넷요금/,"주거·통신"],
 [/선물|축의|부의|경조/,"경조사·선물"],
 [/식당|김밥|국밥|점심|저녁|식사|배달|치킨|피자/,"식비"]
 ];
 for(const [re,cat] of patterns)
  if(re.test(s)&&catList("expense").some(c=>c.name===cat))return cat;
 return catList("expense")[0]?.name||"기타";
}
function learnFrom(t){
 if(t.type!=="expense")return;
 const key=normMerchant(t.merchant);
 if(key.length<2)return;
 const old=db.learn[key];
 db.learn[key]=t.cat;
 if(old&&old!==t.cat)
  toast(`앞으로 ${t.merchant}은(는) ${t.cat}으로 자동 분류해요.`);
}
function duplicate(t,skipId=null){
 return db.tx.find(x=>x.id!==skipId&&
 x.type===t.type&&x.amount===t.amount&&
 similar(x.merchant,t.merchant)&&
 Math.abs((parseDate(x.date)-parseDate(t.date))/86400000)<=1);
}
function saveTx(t,skipDuplicate=false){
 const clean=normalizeTx(t);
 if(!clean.amount){
  toast("금액을 입력해 주세요.");return false;
 }
 if(!clean.merchant.trim()||clean.merchant==="미지정"){
  toast("사용처를 입력해 주세요.");return false;
 }
 if(!skipDuplicate&&duplicate(clean,editingId)&&
 !confirm("비슷한 날짜·금액·사용처의 내역이 있습니다. 그래도 저장할까요?"))
  return false;
 let old=null;
 if(editingId){
  old=db.tx.find(x=>x.id===editingId);
  db.tx=db.tx.filter(x=>x.id!==editingId);
  clean.id=editingId;
  clean.createdAt=old?.createdAt||clean.createdAt;
 }
 db.tx.push(clean);
 learnFrom(clean);
 if(!persist()){
  db.tx=db.tx.filter(x=>x.id!==clean.id);
  if(old)db.tx.push(old);
  return false;
 }
 const b=db.budgets.total;
 const used=sum(transactions(clean.date.slice(0,7),"expense"));
 const cb=db.budgets.categories[clean.cat]||0;
 const cu=sum(transactions(clean.date.slice(0,7),"expense")
  .filter(x=>x.cat===clean.cat));
 if(clean.type==="expense"&&
 ((b>0&&used>b)||(cb>0&&cu>cb)))
  toast("⚠️ 설정한 예산을 초과했습니다.");
 else toast("내역을 저장했습니다.");
 return true;
}

function applyTheme(){
 const t=db.settings.theme;
 const dark=t==="dark"||
 (t==="auto"&&window.matchMedia?.("(prefers-color-scheme: dark)").matches);
 document.body.classList.toggle("dark",dark);
 document.querySelector('meta[name="theme-color"]')
 .content=dark?"#181720":"#ea580c";
}
window.matchMedia?.("(prefers-color-scheme: dark)")
 .addEventListener?.("change",applyTheme);

function installAssets(){
 try{
  const c=document.createElement("canvas");
  c.width=c.height=192;
  const x=c.getContext("2d");
  x.fillStyle="#ea580c";
  x.beginPath();x.roundRect(0,0,192,192,42);x.fill();
  x.fillStyle="#ffffff";
  x.font="bold 112px sans-serif";
  x.textAlign="center";x.textBaseline="middle";
  x.fillText("₩",96,103);
  const icon=c.toDataURL("image/png");
  const link=document.createElement("link");
  link.rel="apple-touch-icon";link.href=icon;
  document.head.appendChild(link);
  if(location.protocol==="https:"){
   const manifest={
    name:"나의 가계부",short_name:"가계부",
    start_url:location.href.split("#")[0],
    scope:new URL(".",location.href).href,
    display:"standalone",
    background_color:"#f3f1f8",
    theme_color:"#ea580c",
    icons:[{src:icon,sizes:"192x192",type:"image/png"}]
   };
   const m=document.createElement("link");
   m.rel="manifest";
   m.href="data:application/manifest+json;charset=utf-8,"+
    encodeURIComponent(JSON.stringify(manifest));
   document.head.appendChild(m);
  }
 }catch{}
}
function isIOSBrowser(){

 !window.matchMedia("(display-mode: standalone)").matches;

/* ---------- 홈 ---------- */
function recurringCandidates(){
 const six=new Date();
 six.setMonth(six.getMonth()-6);
 const groups={};
 for(const t of db.tx){
  if(t.type!=="expense"||parseDate(t.date)<six||
   t.source==="recurring")continue;
  const k=normMerchant(t.merchant);
  if(!k||db.ignored.includes(k)||
   db.recurring.some(r=>similar(r.name,t.merchant)))continue;
  (groups[k]??=[]).push(t);
 }
 const found=[];
 for(const [k,list] of Object.entries(groups)){
  const byMonth={};
  for(const t of sorted(list)){
   const m=t.date.slice(0,7);
   (byMonth[m]??=[]).push(t);
  }
  const months=Object.keys(byMonth).sort();
  const single=months.filter(m=>byMonth[m].length===1);
  let ok=false;
  if(single.length>=3){
   for(let i=2;i<single.length;i++){
    const a=byMonth[single[i-2]][0],
     b=byMonth[single[i-1]][0],
     c=byMonth[single[i]][0];
    const x=monthDate(single[i-2]);
    x.setMonth(x.getMonth()+1);
    const y=monthDate(single[i-1]);
    y.setMonth(y.getMonth()+1);
    const amounts=[a.amount,b.amount,c.amount];
    const avg=amounts.reduce((p,q)=>p+q,0)/3;
    const days=[a,b,c].map(t=>Number(t.date.slice(-2)));
    if(ym(x)===single[i-1]&&ym(y)===single[i]&&
     Math.max(...amounts)-Math.min(...amounts)<=avg*.1&&
     Math.max(...days)-Math.min(...days)<=6)ok=true;
   }
  }
  if(!ok&&single.length>=2){
   for(let i=1;i<single.length;i++){
    const x=monthDate(single[i-1]);
    x.setMonth(x.getMonth()+1);
    if(ym(x)===single[i]&&
     byMonth[single[i-1]][0].amount===byMonth[single[i]][0].amount)
     ok=true;
   }
  }
  if(ok){
   const last=sorted(list)[0];
   found.push({...last,key:k});
  }
 }
 return found.slice(0,3);
}

/* ---------- 내역과 달력 ---------- */
function filteredTx(){
 return sorted(transactions().filter(t=>{
  const q=filter.q.trim().toLowerCase();
  if(q&&!`${t.merchant} ${t.memo} ${t.amount}`.toLowerCase().includes(q))
   return false;
  if(filter.cat!=="전체"&&t.cat!==filter.cat)return false;
  if(filter.payment!=="전체"&&t.payment!==filter.payment)return false;
  if(filter.day&&t.date!==filter.day)return false;
  return true;
 }));
}

function calendarHTML(){
 const y=month.getFullYear(),m=month.getMonth();
 const first=new Date(y,m,1).getDay();
 const days=new Date(y,m+1,0).getDate();
 const amounts={};
 transactions(currentYM(),"expense").forEach(t=>{
  amounts[t.date]=(amounts[t.date]||0)+t.amount;
 });
 const max=Math.max(1,...Object.values(amounts));
 let html=`<div class="card"><div class="calendar">
 ${["일","월","화","수","목","금","토"].map(x=>
 `<div class="weekday">${x}</div>`).join("")}`;
 for(let i=0;i<first;i++)html+=`<div class="day blank"></div>`;
 for(let d=1;d<=days;d++){
  const date=`${currentYM()}-${String(d).padStart(2,"0")}`;
  const amount=amounts[date]||0;
  const intensity=amount?Math.max(.12,amount/max*.7):0;
  html+=`<button class="day ${filter.day===date?"selected":""}"
   data-act="day" data-value="${date}"
   style="${amount?`background:rgba(234,88,12,${intensity});`:""}">
   ${d}<small>${amount?compact(amount):""}</small></button>`;
 }
 html+=`</div><p class="small muted">날짜를 누르면 그날의 내역을 확인할 수 있습니다.</p></div>`;
 if(filter.day){
  const selected=filteredTx();
  html+=`<div class="card"><div class="row">
  <h2>${dateLabel(filter.day)}</h2>
  <button class="btn smallbtn ghost" data-act="clearDay">전체 날짜</button></div>
  ${selected.map(txRow).join("")||empty("해당 날짜의 내역이 없습니다.")}</div>`;
 }
 return html;
}

/* ---------- 통계 및 SVG ---------- */
function groupSum(list,field){
 const o={};
 list.forEach(t=>o[t[field]]=(o[t[field]]||0)+t.amount);
 return Object.entries(o).sort((a,b)=>b[1]-a[1]);
}
function donutHTML(entries,total,highlight=null){
 if(!total)return empty("분석할 지출이 없습니다.");
 const r=72,circ=2*Math.PI*r;
 let cursor=0;
 const circles=entries.map(([name,amt],i)=>{
  const len=amt/total*circ;
  const start=cursor;
  cursor+=len;
  return `<circle cx="110" cy="110" r="${r}" fill="none"
   stroke="${COLORS[i%COLORS.length]}" stroke-width="31"
   stroke-dasharray="${len} ${circ-len}"
   stroke-dashoffset="${-start}"
   transform="rotate(-90 110 110)"
   data-act="statCat" data-value="${esc(name)}"
   style="cursor:pointer;opacity:${highlight&&highlight!==name?.45:1}">
   <title>${esc(name)} ${money(amt)}</title></circle>`;
 }).join("");
 const picked=entries.find(x=>x[0]===highlight);
 const label=picked?picked[0]:"총지출";
 const amount=picked?picked[1]:total;
 const pct=picked?(picked[1]/total*100).toFixed(1)+"%":"100%";
 return `<div class="chartbox">
 <svg viewBox="0 0 220 220" width="248" role="img" aria-label="카테고리별 지출 도넛 차트">
 <circle cx="110" cy="110" r="72" stroke="var(--border)"
 stroke-width="31" fill="none"/>
 ${circles}
 <text x="110" y="91" text-anchor="middle" fill="var(--muted)" font-size="13">${esc(label)}</text>
 <text x="110" y="119" text-anchor="middle" fill="var(--text)" font-size="22" font-weight="bold">${esc(pct)}</text>
 <text x="110" y="140" text-anchor="middle" fill="var(--text)" font-size="13">${money(amount)}</text>
 </svg></div>
 <div class="legend">${entries.map(([name,amt],i)=>
 `<button class="${highlight===name?"active":""}"
 data-act="statCat" data-value="${esc(name)}">
 <span style="color:${COLORS[i%COLORS.length]}">●</span>
 ${esc(name)} ${Math.round(amt/total*100)}%</button>`).join("")}</div>`;
}
function barHTML(){
 const data=[];
 for(let i=5;i>=0;i--){
  const d=new Date(month.getFullYear(),month.getMonth()-i,1);
  const m=ym(d);
  data.push({m,v:sum(transactions(m,"expense"))});
 }
 const max=Math.max(1,...data.map(x=>x.v));
 const bars=data.map((x,i)=>{
  const h=x.v/max*135;
  const xpos=20+i*53;
  return `<g data-act="goMonth" data-value="${x.m}" style="cursor:pointer">
  <rect x="${xpos}" y="${160-h}" width="32" height="${Math.max(2,h)}"
  rx="6" fill="${x.m===currentYM()?"#ea580c":"#c4b5fd"}"/>
  <text x="${xpos+16}" y="${Math.max(13,153-h)}" text-anchor="middle"
  font-size="10" fill="var(--text)">${compact(x.v)}</text>
  <text x="${xpos+16}" y="182" text-anchor="middle"
  font-size="12" fill="var(--text)">${Number(x.m.slice(-2))}월</text>
  </g>`;
 }).join("");
 return `<svg class="bar-chart" viewBox="0 0 340 200"
 role="img" aria-label="최근 6개월 지출 막대 차트">
 ${bars}</svg>`;
}

  const t=pending[pendingIndex];
  if(t.matchId){
   const match=db.tx.find(x=>x.id===t.matchId);
   if(match&&confirm(`${match.merchant} ${money(match.amount)} 내역을 삭제할까요?`)){

/* ---------- 한 줄 입력 ---------- */
const KO_DIGITS={
 "영":0,"일":1,"이":2,"삼":3,"사":4,"오":5,
 "육":6,"칠":7,"팔":8,"구":9
};
function koreanNumber(s){
 s=s.replace(/\s/g,"");
 if(!s)return NaN;
 const section=part=>{
  let result=0,small=0,last=0;
  for(const ch of part){
   if(/\d/.test(ch)){last=last*10+Number(ch);continue}
   if(ch in KO_DIGITS){last=last*10+KO_DIGITS[ch];continue}
   const scale={"십":10,"백":100,"천":1000}[ch];
   if(scale){small+=(last||1)*scale;last=0}
   else return NaN;
  }
  result=small+last;
  return result;
 };
 if(s.includes("만")){
  const parts=s.split("만");
  if(parts.length!==2)return NaN;
  const high=parts[0]?section(parts[0]):1;
  const low=parts[1]?section(parts[1]):0;
  return high*10000+low;
 }
 return section(s);
}
function amountFromText(text){
 const s=String(text).replace(/\s+(?=[천백십만\d])/g,"");
 let m=s.match(/(\d[\d,]*)\s*원/);
 if(m)return {amount:num(m[1]),token:m[0]};
 m=s.match(/([일이삼사오육칠팔구영십백천만\d,]+)\s*원/);
 if(m){
  const a=koreanNumber(m[1]);
  if(Number.isFinite(a)&&a>0)return {amount:a,token:m[0]};
 }
 m=s.match(/(?:^|\s)(\d{2,9})(?=\s|$)/);
 if(m)return {amount:num(m[1]),token:m[1]};
 return {amount:"",token:""};
}
function dateFromNatural(s){
 const today=new Date();
 let date=new Date(today);
 let token="";
 let m=s.match(/(그저께|그제|어제|오늘)/);
 if(m){
  token=m[0];
  date=addDays(today,{"오늘":0,"어제":-1,"그제":-2,"그저께":-2}[token]);
 }else if((m=s.match(/(\d+)\s*일\s*전/))){
  token=m[0];date=addDays(today,-Number(m[1]));
 }else if((m=s.match(/지난\s*(일|월|화|수|목|금|토)요일/))){
  token=m[0];
  const target=["일","월","화","수","목","금","토"].indexOf(m[1]);
  let diff=(today.getDay()-target+7)%7;
  if(!diff)diff=7;
  date=addDays(today,-diff);
 }else if((m=s.match(/(?:(\d{4})[년./-]\s*)?(\d{1,2})\s*(?:월|\/)\s*(\d{1,2})\s*일?/))){
  token=m[0];
  const year=m[1]?Number(m[1]):today.getFullYear();
  date=new Date(year,Number(m[2])-1,Number(m[3]));
  if(!m[1]&&date>today)date.setFullYear(year-1);
  if(date.getMonth()!==Number(m[2])-1)return {date:localISO(),token:""};
 }
 return {date:localISO(date),token};
}
function naturalParse(s){
 const t=defaultTx();
 t.source="quick";
 const date=dateFromNatural(s);
 const amount=amountFromText(s);
 t.date=date.date;
 t.amount=amount.amount;
 t.type=/월급|급여|용돈|입금|받았어|받았어요/.test(s)?"income":"expense";
 t.payment=/카카오페이|네이버페이|토스페이|간편결제/.test(s)?
 "간편결제":/계좌이체|이체|송금/.test(s)?
 "계좌이체":/현금/.test(s)?"현금":"카드";
 let left=s.replace(date.token,"").replace(amount.token,"");
 left=left.replace(/카카오페이|네이버페이|토스페이|간편결제|계좌이체|현금|카드|송금/g," ");
 const meals=left.match(/점심|저녁|아침|야식|간식/g)||[];
 left=left.replace(/점심|저녁|아침|야식|간식/g," ");
 left=left.replace(/(?:에서|으로|로)(?=\s|$)/g," ");
 if(t.type==="income")left=left.replace(/월급|급여|용돈|입금|받았어|받았어요/g," ");
 t.merchant=left.replace(/\s+/g," ").trim();
 t.memo=meals.join(", ");
 if(!t.merchant&&t.type==="income")t.merchant="입금";
 t.cat=guessCat(t.merchant,t.type,t.memo);
 return t;
}

/* ---------- 문자 붙여넣기 ---------- */
function splitMessages(text){
 const raw=text.replace(/\r/g,"").trim();
 if(!raw)return [];
 if(/\[Web발신\]/i.test(raw))
  return raw.split(/(?=\[Web발신\])/i).map(x=>x.trim()).filter(Boolean);
 return raw.split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);
}
function smsAmount(s){
 const lines=s.split("\n");
 for(const line of lines){
  if(/누적|잔액|한도|포인트|적립/.test(line)&&
   !/승인|출금|입금|결제|이용|취소|환불/.test(line))continue;
  const clean=line.replace(/(?:누적|잔액|한도|포인트|적립)\s*[:：]?\s*[\d,]+\s*원/g,"");
  const m=clean.match(/([\d,]+)\s*원/);
  if(m)return num(m[1]);
 }
 return "";
}
function smsDate(s){
 const now=new Date();
 const m=s.match(/(?:(\d{4})[\/.-])?(\d{1,2})[\/.-](\d{1,2})(?:\s|$|[^\d])/);
 if(m){
  let y=m[1]?Number(m[1]):now.getFullYear();
  const x=new Date(y,Number(m[2])-1,Number(m[3]));
  if(!m[1]&&x>now)x.setFullYear(y-1);
  if(x.getMonth()===Number(m[2])-1)return localISO(x);
 }
 return localISO();
}
function findCancellation(t){
 const date=parseDate(t.date)||new Date();
 return sorted(db.tx.filter(x=>
  x.type==="expense"&&x.amount===t.amount&&
  Math.abs((date-parseDate(x.date))/86400000)<=62&&
  similar(x.merchant,t.merchant)
 ))[0]||null;
}
function smsMerchant(s){
 const lines=s.replace(/\[Web발신\]/gi,"").split("\n")
  .map(x=>x.trim()).filter(Boolean);
 const discard=/^(?:국민|신한|현대|삼성|롯데|우리|하나|BC|KB|NH|농협|토스)(?:카드|은행)?\s*$/i;
 const cleaned=lines.map(line=>
  line.replace(/홍.{0,5}님/g,"")
  .replace(/(?:KB국민|국민|신한|현대|삼성|롯데|우리|하나|비씨|BC|NH농협|농협|토스)(?:카드|은행)/gi,"")
  .replace(/(?:승인|결제|출금|입금|이용|취소|환불|일시불|할부|누적|잔액|금액|한도|포인트|적립|현금영수증)/g,"")
  .replace(/[\d,]+\s*원/g,"")
  .replace(/\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2}/g,"")
  .replace(/\d{1,2}[\/.-]\d{1,2}/g,"")
  .replace(/\d{1,2}:\d{2}(?::\d{2})?/g,"")
  .replace(/\*{2,}\d*/g,"")
  .replace(/^[\s\[\]():-]+|[\s\[\]():-]+$/g,"")
 ).filter(x=>x&&!discard.test(x)&&
 !/^(고객|고맙|감사|문의|고객센터|http|www)/i.test(x));
 return cleaned.sort((a,b)=>b.length-a.length)[0]?.slice(0,70)||"미확인";
}
function parseSMS(s){
 if(/인증번호|인증코드|광고|\(광고\)|ATM|현금\s*인출|카드대금|카드\s*결제대금/i.test(s))
  return null;
 if(!/승인|결제|출금|이용|취소|환불|입금|이체|송금|받았어요|보냈어요/.test(s))
  return null;
 const t=defaultTx();
 t.source="sms";
 t.date=smsDate(s);
 t.amount=smsAmount(s);
 t.type=/입금|받았어요|받았어/.test(s)&&
 !/입금취소/.test(s)?"income":"expense";
 t.payment=/현금영수증/.test(s)?"현금":
 /입금|출금|이체|송금|보냈어요|받았어요/.test(s)?"계좌이체":
 /카카오페이|네이버페이|토스페이/.test(s)?"간편결제":"카드";
 t.merchant=smsMerchant(s);
 t.cat=guessCat(t.merchant,t.type,s);
 t.memo="문자에서 읽음";
 const foreign=s.match(/(?:USD|EUR|JPY|CNY|GBP)\s*[\d,.]+|[\d,.]+\s*(?:USD|EUR|JPY|CNY|GBP)/i);
 if(foreign){
  t.amount="";

 }
 if(/취소|환불/.test(s)){

 }
 return t;
}

}

/* ---------- 영수증 사진 처리 ---------- */
function canvasResize(img,max,quality=.85){
 const scale=Math.min(1,max/Math.max(img.width,img.height));
 const c=document.createElement("canvas");
 c.width=Math.max(1,Math.round(img.width*scale));
 c.height=Math.max(1,Math.round(img.height*scale));
 const ctx=c.getContext("2d");
 ctx.fillStyle="white";ctx.fillRect(0,0,c.width,c.height);
 ctx.drawImage(img,0,0,c.width,c.height);
 return c.toDataURL("image/jpeg",quality);
}
async function processPhoto(file){
 if(!file.type.startsWith("image/"))throw Error("이미지 파일이 아닙니다.");
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();
  await new Promise((resolve,reject)=>{
   img.onload=resolve;img.onerror=()=>reject(Error("사진을 열 수 없습니다."));
   img.src=url;
  });
  return {
   full:canvasResize(img,2000,.85),
   thumb:canvasResize(img,240,.75)
  };
 }finally{URL.revokeObjectURL(url)}
}

function parseAIJSON(s){
 const cleaned=String(s||"").replace(/```(?:json)?/gi,"").replace(/```/g,"");
 const start=cleaned.indexOf("{"),end=cleaned.lastIndexOf("}");
 if(start<0||end<start)throw Error("AI 응답에서 JSON을 찾지 못했습니다.");
 return JSON.parse(cleaned.slice(start,end+1));
}
function normalizeAI(o){
 const t=defaultTx();
 t.source="receipt";
 t.merchant=String(o.merchant||"");
 t.date=validDate(o.date)?o.date:localISO();
 t.amount=o.amount===null||o.amount===undefined?"":num(o.amount);
 t.payment=PAYMENTS.includes(o.payment)?o.payment:"카드";
 t.cat=catList("expense").some(c=>c.name===o.category)?
 o.category:guessCat(t.merchant,"expense");
 t.memo=Array.isArray(o.items)?
 o.items.slice(0,8).map(x=>typeof x==="string"?x:JSON.stringify(x)).join(", "):"";
 if(o.confidence!==undefined&&o.confidence!==null)
  t.memo+=` (인식 신뢰도 ${Math.round(Number(o.confidence)*100)||0}%)`;
 return t;
}
function aiError(response,body){
 if(response.status===401||response.status===403)
  return "API 키나 사용 권한을 확인해 주세요.";
 if(response.status===404)
  return "모델 이름을 찾을 수 없습니다. 설정에서 모델을 확인해 주세요.";
 if(response.status===429)
  return "API 사용 한도를 초과했습니다. 잠시 후 다시 시도해 주세요.";
 return body?.error?.message||"AI 서버에 연결하지 못했습니다.";
}
async function askGemini(prompt,imageData){
 if(!api.geminiKey)throw Error("Gemini API 키가 없습니다.");
 const model=encodeURIComponent(api.geminiModel||"gemini-3.5-flash");
 const parts=[{text:prompt}];
 if(imageData)parts.push({
  inline_data:{mime_type:"image/jpeg",data:base64data(imageData)}
 });
 const response=await fetch(
 `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
 method:"POST",
 headers:{"x-goog-api-key":api.geminiKey,"content-type":"application/json"},
 body:JSON.stringify({
  contents:[{parts}],
  generationConfig:{temperature:0,responseMimeType:"application/json"}
 })
 });
 const json=await response.json();
 if(!response.ok)throw Error(aiError(response,json));
 return parseAIJSON((json.candidates?.[0]?.content?.parts||[])
  .map(x=>x.text||"").join(""));
}
async function askClaude(prompt,imageData){

let tesseractPromise=null;
async function loadTesseract(){
 if(window.Tesseract)return window.Tesseract;
 if(tesseractPromise)return tesseractPromise;
 tesseractPromise=new Promise((resolve,reject)=>{
  const script=document.createElement("script");
  script.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
  script.onload=()=>resolve(window.Tesseract);
  script.onerror=()=>reject(Error("OCR 라이브러리를 내려받지 못했습니다."));
  document.head.appendChild(script);
 });
 return tesseractPromise;
}
async function localOCR(imageData){
 const Tess=await loadTesseract();
 const worker=await Tess.createWorker("kor+eng",1);
 try{
  const result=await worker.recognize(imageData);
  const text=result.data.text||"";
  const lines=text.split("\n").map(s=>s.trim()).filter(Boolean);
  const t=defaultTx();
  t.source="receipt";
  t.merchant=lines[0]||"";
  const d=text.match(/(20\d{2})[./-](\d{1,2})[./-](\d{1,2})/);
  if(d){
   const date=`${d[1]}-${d[2].padStart(2,"0")}-${d[3].padStart(2,"0")}`;
   if(validDate(date))t.date=date;
  }
  const amountLine=lines.find(s=>/합계|결제금액|총액|받을금액/.test(s));
  const values=(amountLine||"").match(/[\d,]+\s*원?/g)||[];
  t.amount=values.length?num(values[values.length-1]):"";
  t.cat=guessCat(t.merchant,"expense");
  t.memo="기기 내 OCR로 읽음";
  t.warning="기기 내 문자 인식은 정확도가 낮을 수 있습니다. 금액과 날짜를 꼭 확인하세요.";
  return t;
 }finally{await worker.terminate()}
}

function addRecurringEntries(){
 let changed=false;
 const today=localISO();
 const now=new Date();
 for(const r of db.recurring){
  const start=monthDate(r.start||currentYM());
  if(!Number.isFinite(start.getTime()))continue;
  let count=0;
  for(let d=new Date(start);d<=now&&count<240;d.setMonth(d.getMonth()+1),count++){
   const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
   const date=localISO(new Date(d.getFullYear(),d.getMonth(),
    Math.min(Number(r.day)||1,last)));
   if(date>today)continue;
   const key=`[고정:${r.id}:${date.slice(0,7)}]`;
   if(db.tx.some(t=>t.source==="recurring"&&t.memo.includes(key)))continue;
   db.tx.push(normalizeTx({
    type:"expense",date,merchant:r.name,amount:r.amount,
    cat:r.cat,payment:r.payment||"카드",
    memo:key,source:"recurring"
   }));
   changed=true;
  }
 }
 if(changed)persist();
}

async function hashPIN(pin,salt){
 if(!crypto.subtle)throw Error("이 환경에서는 안전한 PIN 암호화를 지원하지 않습니다.");
 const data=new TextEncoder().encode(salt+":"+pin);
 const digest=await crypto.subtle.digest("SHA-256",data);
 return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

function csvCell(v){
 const s=String(v??"");
 return `"${s.replace(/"/g,'""')}"`;
}
function downloadFile(name,content,mime,bom=false){
 const blob=new Blob([...(bom?["\ufeff"]:[]),content],{type:mime});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download=name;document.body.appendChild(a);
 a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const CSV_FIELDS=[
 "id","type","date","merchant","amount","cat",
 "payment","memo","source","createdAt"
];
function exportCSV(){
 const rows=[CSV_FIELDS.join(",")];
 db.tx.forEach(t=>rows.push(CSV_FIELDS.map(k=>csvCell(t[k])).join(",")));
 downloadFile("가계부_"+localISO()+".csv",rows.join("\r\n"),
  "text/csv;charset=utf-8",true);
}
function parseCSV(text){
 const rows=[];
 let row=[],field="",quoted=false;
 text=text.replace(/^\ufeff/,"");
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(c==='"'){
   if(quoted&&text[i+1]==='"'){field+='"';i++}
   else quoted=!quoted;
  }else if(c===","&&!quoted){
   row.push(field);field="";
  }else if((c==="\n"||c==="\r")&&!quoted){
   if(c==="\r"&&text[i+1]==="\n")i++;
   row.push(field);
   if(row.some(x=>x!==""))rows.push(row);
   row=[];field="";
  }else field+=c;
 }
 row.push(field);
 if(row.some(x=>x!==""))rows.push(row);
 return rows;
}
async function importCSV(file){
 const rows=parseCSV(await file.text());
 const header=rows.shift()||[];
 if(!["date","merchant","amount"].every(x=>header.includes(x))){
  toast("올바른 가계부 CSV 파일이 아닙니다.");return;
 }
 let count=0;
 for(const row of rows){
  const o={};
  header.forEach((k,i)=>o[k]=row[i]||"");
  if(!validDate(o.date)||!num(o.amount))continue;
  o.source="import";o.id=uid();
  const t=normalizeTx(o);
  if(!duplicate(t)){db.tx.push(t);count++}
 }
 persist();render();toast(`${count}건을 가져왔습니다.`);
}

 ["expense",12,"영화관",29000,"문화·여가","카드"]
 ];
 for(const [type,days,name,amount,cat,payment] of examples){
  const d=addDays(new Date(),-days);
  const t=normalizeTx({
   type,date:localISO(d),merchant:name,amount,cat,payment,
   source:"manual",memo:"연습용 샘플"
  });
  db.tx.push(t);db.sampleIds.push(t.id);
 }
 persist();render();toast("샘플 데이터를 넣었습니다.");
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click",async e=>{
 const el=e.target.closest("[data-act]");
 if(!el||locked)return;
 const act=el.dataset.act;
 const value=el.dataset.value;
 const id=el.dataset.id;
 try{
 switch(act){
 case "tab":
  tab=value;filter.day="";render();break;
 case "month":changeMonth(Number(value));break;
 case "goMonth":
  month=monthDate(value);tab="stats";selectedCat="";render();break;
 case "view":filter.view=value;filter.day="";render();break;
 case "filterCat":filter.cat=value;render();break;
 case "filterPay":filter.payment=value;render();break;
 case "day":filter.day=value;render();break;
 case "clearDay":filter.day="";render();break;
 case "statCat":selectedCat=value;render();break;
 case "openAdd":pending=[];editingId=null;addSheet();break;
 case "close":closeModal();break;
 case "manual":pending=[];editingId=null;openForm();break;
 case "camera":document.getElementById("cameraInput").click();break;
 case "photos":document.getElementById("photoInput").click();break;
 case "smsSheet":smsSheet();break;
 case "readSMS":await readSMS();break;
 case "edit":editTx(id);break;
 case "formType":formType(value);break;
 case "saveForm":handleFormSave();break;
 case "deleteTx":
  if(confirm("정말 이 내역을 삭제할까요?")){
   db.tx=db.tx.filter(t=>t.id!==editingId);
   persist();closeModal();render();toast("삭제했습니다.");
  }break;
 case "preview":{
  const src=el.getAttribute("src");
  if(src){
   openModal("사진 확대",`<img src="${esc(src)}"
   style="width:100%;height:auto" alt="영수증 확대">`,"preview");
  }break;
 }
 case "saveBudgets":{
  db.budgets.total=num(document.getElementById("budgetTotal").value);
  document.querySelectorAll(".catBudget").forEach(x=>{
   db.budgets.categories[x.dataset.cat]=num(x.value);
  });
  persist();render();toast("예산을 저장했습니다.");break;
 }
 case "saveAI":{
  db.settings.ocr=document.getElementById("ocrMethod").value;
  api.geminiKey=document.getElementById("geminiKey").value.trim();
  api.geminiModel=document.getElementById("geminiModel").value.trim();
  api.claudeKey=document.getElementById("claudeKey").value.trim();
  api.claudeModel=document.getElementById("claudeModel").value.trim();
  persist();persistAPI();toast("인식 설정을 저장했습니다.");break;
 }
 case "testAI":{
  const method=document.getElementById("ocrMethod").value;
  if(method==="none"){toast("인식 방식을 먼저 선택해 주세요.");break}
  if(method==="local"){
   await loadTesseract();toast("OCR 라이브러리를 불러왔습니다.");break;
  }
  api.geminiKey=document.getElementById("geminiKey").value.trim();
  api.geminiModel=document.getElementById("geminiModel").value.trim();
  api.claudeKey=document.getElementById("claudeKey").value.trim();
  api.claudeModel=document.getElementById("claudeModel").value.trim();
  const response=method==="gemini"?
  await askGemini('{"ok":true} JSON 객체만 출력하세요.',null):
  await askClaude('{"ok":true} JSON 객체만 출력하세요.',null);
  toast(response?"API 연결에 성공했습니다.":"응답을 확인해 주세요.");
  break;
 }
 case "recurringForm":recurringForm();break;
 case "removeRecurring":
  if(confirm("고정지출 설정을 삭제할까요? 기존 거래는 유지됩니다.")){
   db.recurring=db.recurring.filter(r=>r.id!==id);
   persist();render();
  }break;
 case "repeatAdd":{
  const t=db.tx.find(x=>x.id===id);
  if(t)recurringForm({
   name:t.merchant,amount:t.amount,day:Number(t.date.slice(-2)),
   cat:t.cat,payment:t.payment,start:currentYM()
  });break;
 }
 case "repeatIgnore":
  db.ignored.push(value);persist();render();break;
 case "unignore":
  db.ignored=db.ignored.filter(x=>x!==value);
  persist();render();break;
 case "unlearn":
  delete db.learn[value];persist();render();break;
 case "addCat":{
  const name=prompt("새 카테고리 이름을 입력해 주세요.");
  if(!name?.trim())break;
  const emoji=prompt("카테고리 이모지를 입력해 주세요.","📌")||"📌";
  if(catList(value).some(c=>c.name===name.trim())){
   toast("이미 있는 카테고리입니다.");break;
  }
  catList(value).push({name:name.trim().slice(0,40),
   emoji:emoji.slice(0,8)});
  persist();render();break;
 }
 case "removeCat":{
  const type=el.dataset.type;
  if(catList(type).length<=1){
   toast("카테고리는 최소 하나가 필요합니다.");break;
  }
  if(db.tx.some(t=>t.type===type&&t.cat===value)){
   toast("이 카테고리를 사용하는 내역이 있어 삭제할 수 없습니다.");break;
  }
  if(confirm(`${value} 카테고리를 삭제할까요?`)){
   db.cats[type]=catList(type).filter(c=>c.name!==value);
   delete db.budgets.categories[value];
   persist();render();
  }break;
 }
 case "pinForm":pinForm();break;
 case "removePIN":{
  const old=document.querySelector('#pinForm [name="old"]').value;
  if(await hashPIN(old,db.pinSalt)!==db.pinHash){
   toast("현재 PIN이 틀렸습니다.");break;
  }
  if(confirm("PIN 잠금을 해제할까요?")){
   db.pinHash="";db.pinSalt="";
   persist();closeModal();render();
  }break;
 }
 case "exportCSV":exportCSV();break;
 case "importCSV":document.getElementById("csvInput").click();break;
 case "exportJSON":exportJSON();break;
 case "importJSON":document.getElementById("jsonInput").click();break;
 case "samplesAdd":addSamples();break;
 case "samplesRemove":
  if(confirm("연습용 샘플 내역만 삭제할까요?")){
   db.tx=db.tx.filter(t=>!db.sampleIds.includes(t.id));
   db.sampleIds=[];persist();render();toast("샘플을 삭제했습니다.");
  }break;
 case "deleteAll":
  if(confirm("1차 확인: 모든 거래와 설정을 삭제할까요?")&&
   confirm("2차 확인: 백업하지 않은 자료는 복구할 수 없습니다. 정말 삭제할까요?")){
   localStorage.removeItem(KEY);
   localStorage.removeItem(APIKEY);
   db=initialDB();
   api={geminiKey:"",geminiModel:"gemini-3.5-flash",
    claudeKey:"",claudeModel:"claude-haiku-5-5"};
   unlockScreen();render();toast("모든 데이터를 삭제했습니다.");
  }break;
 }
 }catch(err){
  toast("작업 중 오류가 발생했습니다: "+(err.message||"다시 시도해 주세요."));
 }
});
document.addEventListener("submit",async e=>{
 const form=e.target;
 if(!["quickForm","txForm","recurringForm","pinForm","unlockForm"].includes(form.id))return;
 e.preventDefault();
 try{
 if(form.id==="quickForm"){
  const text=document.getElementById("quickText").value.trim();
  if(!text)return;
  pending=[];editingId=null;
  openForm(naturalParse(text),{title:"한 줄 입력 확인"});
 }
 if(form.id==="txForm")handleFormSave();
 if(form.id==="recurringForm"){
  const fd=new FormData(form);
  const item={
   id:uid(),name:String(fd.get("name")).trim(),
   amount:num(fd.get("amount")),day:Number(fd.get("day")),
   cat:fd.get("cat"),payment:fd.get("payment"),
   start:fd.get("start")
  };
  if(!item.name||!item.amount||item.day<1||item.day>31){
   toast("고정지출 정보를 확인해 주세요.");return;
  }
  db.recurring.push(item);
  addRecurringEntries();persist();closeModal();render();
  toast("고정지출을 등록했습니다.");
 }
 if(form.id==="pinForm"){
  const fd=new FormData(form);
  const pin=String(fd.get("pin")||"");
  if(!/^\d{4}$/.test(pin)||pin!==fd.get("confirm")){
   toast("새 PIN 4자리를 똑같이 입력해 주세요.");return;
  }
  if(db.pinHash&&await hashPIN(fd.get("old"),db.pinSalt)!==db.pinHash){
   toast("현재 PIN이 틀렸습니다.");return;
  }
  const bytes=new Uint8Array(16);
  crypto.getRandomValues(bytes);
  db.pinSalt=[...bytes].map(x=>x.toString(16).padStart(2,"0")).join("");
  db.pinHash=await hashPIN(pin,db.pinSalt);
  persist();closeModal();render();toast("PIN을 설정했습니다.");
 }
 if(form.id==="unlockForm"){
  const pin=document.getElementById("unlockPIN").value;
  if(await hashPIN(pin,db.pinSalt)===db.pinHash){
   awayAt=0;unlockScreen();
  }else toast("PIN이 일치하지 않습니다.");
 }
 }catch(err){toast(err.message||"입력을 확인해 주세요.")}
});
document.addEventListener("input",e=>{
 if(e.target.id==="searchTx"){
  filter.q=e.target.value;
  const pos=e.target.selectionStart;
  const root=document.getElementById("app");
  root.innerHTML=historyHTML();
  const input=document.getElementById("searchTx");
  input.focus();
  input.setSelectionRange(pos,pos);
 }
});
document.getElementById("cameraInput").addEventListener("change",async e=>{
 const files=[...e.target.files];e.target.value="";
 if(files.length)await handlePhotos(files);
});
document.getElementById("photoInput").addEventListener("change",async e=>{
 const files=[...e.target.files];e.target.value="";
 if(files.length)await handlePhotos(files);
});
document.getElementById("csvInput").addEventListener("change",async e=>{
 const file=e.target.files[0];e.target.value="";
 if(file)try{await importCSV(file)}catch(err){toast(err.message)}
});
document.getElementById("jsonInput").addEventListener("change",async e=>{
 const file=e.target.files[0];e.target.value="";
 if(file)try{await importJSON(file)}catch(err){toast(err.message)}
});
document.addEventListener("keydown",e=>{
 if((e.key==="Enter"||e.key===" ")&&
 e.target.matches(".transaction")){
  e.preventDefault();
  e.target.click();
 }
 if(e.key==="Escape"&&!locked)closeModal();
});

/* ---------- 시작 ---------- */
installAssets();
addRecurringEntries();
render();
if(locked)lockScreen();
</script>
